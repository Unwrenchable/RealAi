<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RealAI Hive - live agents</title>
<style>
:root{--bg:#0b0f0c;--panel:#111a14;--line:#1f3326;--fg:#cfe8d3;--dim:#7c9a83;--acc:#38f27a;--warn:#ffc857;--bad:#ff5d5d;--rev:#6fb7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-monospace,Consolas,monospace}
header{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;color:var(--acc);letter-spacing:.5px}
input,select,button,textarea{background:#0e1611;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
button{cursor:pointer}button.primary{border-color:var(--acc);color:var(--acc)}button:disabled{opacity:.5;cursor:default}
.pill{padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.pill.on{color:var(--acc);border-color:var(--acc)}.pill.off{color:var(--bad);border-color:var(--bad)}
main{display:grid;grid-template-columns:minmax(380px,1.2fr) 1fr;gap:12px;padding:12px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px;overflow:hidden}
section h2{font-size:12px;text-transform:uppercase;color:var(--dim);margin:0 0 8px;letter-spacing:1px}
#graph{width:100%;height:330px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:8px;padding:8px;min-height:74px}
.card .n{font-weight:bold}.card .r{color:var(--dim);font-size:11px}.card .a{margin-top:4px;color:var(--fg);font-size:12px;word-break:break-word}
.card.working{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.card.reviewing{border-color:var(--rev)}.card.done{opacity:.85}
.st{float:right;font-size:11px}.st.working{color:var(--acc)}.st.reviewing{color:var(--rev)}.st.done{color:var(--dim)}
#timeline{height:340px;overflow:auto;display:flex;flex-direction:column-reverse}
.ev{padding:3px 0;border-bottom:1px dashed #17261c;word-break:break-word}.ev .t{color:var(--dim);margin-right:6px}
.ev .k{display:inline-block;min-width:96px;color:var(--acc)}.ev.flag .k{color:var(--warn)}.ev.finding .k{color:var(--bad)}.ev.review .k,.ev.handoff .k{color:var(--rev)}
ul{margin:0;padding-left:18px}#files li,#findings li{margin:2px 0;word-break:break-all}
#findings li .o{color:var(--dim)}.wide{grid-column:1/-1}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:52px}#out{white-space:pre-wrap;color:var(--dim);max-height:170px;overflow:auto;margin-top:6px}
small{color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>RealAI HIVE &middot; live agents</h1>
  <span id="conn" class="pill off">disconnected</span>
  <label>team <select id="team"></select></label>
  <input id="token" type="password" placeholder="hive token (session only)" autocomplete="off" size="22">
  <button id="connect" class="primary">Connect</button>
  <small id="hint"></small>
</header>
<main>
  <section><h2>Team graph <small>lead &rarr; owners &rarr; reviewers</small></h2><svg id="graph" viewBox="0 0 640 330"></svg></section>
  <section><h2>Run</h2>
    <textarea id="goal">review the quest system for bugs and propose fixes</textarea>
    <div class="row"><button id="runTeam" class="primary">Run team goal</button><button id="runPt">Run playtest</button>
      <small>read-only: agents can list, read and search the team workspace; no writes, no patches</small></div>
    <div id="out"></div>
  </section>
  <section class="wide"><h2>Agents</h2><div id="cards" class="cards"></div></section>
  <section><h2>Live timeline</h2><div id="timeline"></div></section>
  <section><h2>Files read <small id="fcount"></small></h2><ul id="files"></ul>
    <h2 style="margin-top:12px">Findings</h2><ul id="findings"></ul></section>
</main>
<script>
(() => {
  'use strict';
  const API = location.origin;
  const $ = (id) => document.getElementById(id);
  const S = { teams: [], team: null, agents: new Map(), files: new Set(), lastSeq: 0, abort: null };
  // Optional one-shot hand-off: /agents-ui/#token=... (fragment is never sent to the server); moved to
  // sessionStorage and wiped from the address bar immediately.
  (() => {
    const m = /(?:^|[#&])token=([^&]+)/.exec(location.hash || '');
    if (m) { sessionStorage.setItem('realai_hive_token', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
  })();
  const tok = () => sessionStorage.getItem('realai_hive_token') || '';
  $('token').value = tok();
  const hdrs = (json) => { const h = { 'X-RealAI-Token': tok() }; if (json) h['Content-Type'] = 'application/json'; return h; };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; };
  const hint = (t) => { $('hint').textContent = t || ''; };

  async function api(path, opts = {}) {
    const r = await fetch(API + path, { ...opts, headers: hdrs(!!opts.body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
    return j;
  }

  // ---------- team graph + cards ----------
  function agentState(id) {
    if (!S.agents.has(id)) S.agents.set(id, { id, role: '', status: 'idle', action: '' });
    return S.agents.get(id);
  }
  function selectTeam(id) {
    S.team = S.teams.find(t => t.id === id) || S.teams[0] || null;
    S.agents.clear();
    if (!S.team) return;
    agentState(S.team.lead).role = 'lead';
    for (const o of S.team.ownership) {
      const a = agentState(o.owner); a.role = a.role || ('owner: ' + o.area);
      if (o.reviewer) { const r = agentState(o.reviewer); r.role = r.role || ('reviewer: ' + o.area); }
    }
    for (const m of S.team.members) agentState(m);
    drawGraph(); drawCards(); loadFindings();
  }
  function drawGraph(active) {
    const svg = $('graph'); while (svg.firstChild) svg.removeChild(svg.firstChild);
    if (!S.team) return;
    const NS = 'http://www.w3.org/2000/svg';
    const lead = S.team.lead;
    const owners = [...new Set(S.team.ownership.map(o => o.owner))].filter(x => x !== lead);
    const reviewers = [...new Set(S.team.ownership.map(o => o.reviewer).filter(Boolean))].filter(x => x !== lead && !owners.includes(x));
    const pos = new Map(); pos.set(lead, [320, 36]);
    owners.forEach((o, i) => pos.set(o, [40 + (560 / Math.max(1, owners.length - 1 || 1)) * i + (owners.length === 1 ? 280 : 0), 160]));
    reviewers.forEach((o, i) => pos.set(o, [80 + (480 / Math.max(1, reviewers.length - 1 || 1)) * i + (reviewers.length === 1 ? 240 : 0), 285]));
    const line = (a, b, color, dash) => {
      const p = pos.get(a), q = pos.get(b); if (!p || !q) return;
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', p[0]); l.setAttribute('y1', p[1]); l.setAttribute('x2', q[0]); l.setAttribute('y2', q[1]);
      l.setAttribute('stroke', color); l.setAttribute('stroke-width', '1.3'); if (dash) l.setAttribute('stroke-dasharray', '4 3');
      svg.appendChild(l);
    };
    for (const o of owners) line(lead, o, '#2f5c3c');
    for (const o of S.team.ownership) if (o.reviewer) line(o.owner, o.reviewer, '#2b4f73', true);
    for (const [id, [x, y]] of pos) {
      const st = agentState(id).status;
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', id === lead ? 15 : 11);
      c.setAttribute('fill', st === 'working' ? '#38f27a' : st === 'reviewing' ? '#6fb7ff' : st === 'done' ? '#2d4a35' : '#16241a');
      c.setAttribute('stroke', id === lead ? '#ffc857' : '#38f27a'); svg.appendChild(c);
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', x); t.setAttribute('y', y + (id === lead ? 30 : 25)); t.setAttribute('fill', '#cfe8d3');
      t.setAttribute('font-size', '10'); t.setAttribute('text-anchor', 'middle'); t.textContent = id; svg.appendChild(t);
    }
  }
  function drawCards() {
    const box = $('cards'); box.replaceChildren();
    for (const a of S.agents.values()) {
      const c = el('div', 'card ' + a.status);
      c.append(el('span', 'st ' + a.status, a.status), el('div', 'n', a.id), el('div', 'r', a.role || 'member'), el('div', 'a', a.action || ''));
      box.appendChild(c);
    }
  }
  function setAgent(id, status, action) {
    if (!id) return; const a = agentState(id);
    if (status) a.status = status; if (action != null) a.action = action;
    drawCards(); drawGraph();
  }

  // ---------- events ----------
  function fmtTime(ts) { return new Date((ts || Date.now() / 1000) * 1000).toLocaleTimeString(); }
  function line(ev, kind, text) {
    const d = el('div', 'ev ' + kind); d.append(el('span', 't', fmtTime(ev.ts)), el('span', 'k', ev.type), document.createTextNode(text));
    const tl = $('timeline'); tl.prepend(d); while (tl.childNodes.length > 400) tl.removeChild(tl.lastChild);
  }
  function addFile(p) { if (!p || S.files.has(p)) return; S.files.add(p); $('files').prepend(el('li', '', p)); $('fcount').textContent = S.files.size + ' files'; }
  function addFinding(f) {
    const li = el('li'); li.append(document.createTextNode((f.task || f.summary || 'finding') + ' '), el('span', 'o', '-> ' + ((f.details && f.details.owner) || f.owner || '?') + (f.reviewer ? ' (cc ' + f.reviewer + ')' : '')));
    if (f.observed || (f.details && f.details.observed)) li.title = String(f.observed || f.details.observed);
    $('findings').prepend(li);
  }
  function onEvent(ev) {
    if (!ev || !ev.type || ev.type === 'connected') return;
    if (ev.seq) S.lastSeq = Math.max(S.lastSeq, ev.seq);
    if (S.team && ev.team && ev.team !== S.team.id) return;
    switch (ev.type) {
      case 'run.started': line(ev, '', `${ev.kind} ${ev.run} ${ev.goal ? '- ' + ev.goal : ''}`); for (const a of S.agents.values()) { a.status = 'idle'; a.action = ''; } drawCards(); drawGraph(); break;
      case 'plan.created': line(ev, '', `planner=${ev.planner}${ev.live ? ' (live model)' : ' (offline)'}: ` + (ev.steps || []).map((s, i) => `${i + 1}. [${s.area || '-'}] ${s.step}`).join('  ')); setAgent(ev.lead, 'done', 'planned ' + (ev.steps || []).length + ' steps'); break;
      case 'handoff': line(ev, 'handoff', `${ev.src} -> ${ev.dst} (${ev.area || ev.reason || ''})`); break;
      case 'step.started': line(ev, '', `${ev.agent}: ${ev.step}`); setAgent(ev.agent, 'working', ev.step); break;
      case 'tool.call': { const a = ev.args || {}; const what = a.path || a.pattern || a.query || ''; line(ev, '', `${ev.agent} ${ev.tool} ${what}${a.glob ? ' [' + a.glob + ']' : ''}${ev.error ? ' (' + ev.error + ')' : ''}`); setAgent(ev.agent, 'working', `${ev.tool} ${what}`); if (ev.tool === 'read_file' && !ev.error) addFile(a.path); break; }
      case 'grounding.flag': line(ev, 'flag', `${ev.agent}: ${ev.action} invented paths: ${(ev.invented || []).join(', ')}`); break;
      case 'step.finished': (ev.files_read || []).forEach(addFile); line(ev, '', `${ev.agent} done${ev.fallback ? ' (fallback)' : ''}: ${String(ev.output || '').slice(0, 220)}`); setAgent(ev.agent, 'done', String(ev.output || '').slice(0, 160)); break;
      case 'review': line(ev, 'review', `${ev.src} -> review by ${ev.dst}`); setAgent(ev.dst, 'reviewing', 'reviewing ' + ev.src); break;
      case 'qa.finding': line(ev, 'finding', `${ev.agent} -> ${ev.owner}: ${ev.summary}`); addFinding(ev); break;
      case 'run.finished': line(ev, '', `${ev.kind} finished${ev.failed != null ? ' - ' + ev.failed + '/' + ev.total + ' failed' : ''}`); for (const a of S.agents.values()) if (a.status !== 'idle') a.status = 'done'; drawCards(); drawGraph(); setBusy(false); break;
      case 'run.error': line(ev, 'finding', `run error ${ev.error}`); setBusy(false); break;
      default: line(ev, '', JSON.stringify(ev).slice(0, 200));
    }
  }
  async function stream() {
    if (S.abort) S.abort.abort();
    const ac = new AbortController(); S.abort = ac;
    try {
      const r = await fetch(API + '/v1/hive/events?after=' + S.lastSeq, { headers: hdrs(false), signal: ac.signal });
      if (!r.ok) { $('conn').className = 'pill off'; $('conn').textContent = r.status === 401 ? 'bad token' : 'HTTP ' + r.status; return; }
      $('conn').className = 'pill on'; $('conn').textContent = 'live';
      const rd = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i; while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          for (const ln of chunk.split('\n')) if (ln.startsWith('data: ')) { try { onEvent(JSON.parse(ln.slice(6))); } catch (_e) { /* skip */ } }
        }
      }
    } catch (e) { if (ac.signal.aborted) return; }
    $('conn').className = 'pill off'; $('conn').textContent = 'reconnecting';
    setTimeout(() => { if (S.abort === ac) stream(); }, 2000);
  }

  // ---------- actions ----------
  function setBusy(b) { $('runTeam').disabled = b; $('runPt').disabled = b; }
  async function loadFindings() {
    if (!S.team) return;
    try { const j = await api('/v1/hive/findings?limit=30&team=' + encodeURIComponent(S.team.id)); $('findings').replaceChildren(); (j.findings || []).forEach(addFinding); } catch (_e) { /* ignore */ }
  }
  async function connect() {
    sessionStorage.setItem('realai_hive_token', $('token').value.trim());
    try {
      const j = await api('/v1/hive/teams'); S.teams = j.teams || [];
      const sel = $('team'); sel.replaceChildren(...S.teams.map(t => { const o = el('option', '', t.id); o.value = t.id; return o; }));
      const want = S.teams.find(t => t.id === 'vault77') ? 'vault77' : (S.teams[0] || {}).id; sel.value = want; selectTeam(want);
      hint(''); stream();
    } catch (e) { $('conn').className = 'pill off'; $('conn').textContent = 'disconnected'; hint(e.message === 'token_required' ? 'token required' : e.message); }
  }
  async function run(kind) {
    if (!S.team) return; setBusy(true); $('out').textContent = '';
    const path = kind === 'team' ? `/v1/hive/teams/${encodeURIComponent(S.team.id)}/run` : '/v1/hive/playtest';
    const body = kind === 'team' ? { goal: $('goal').value.trim(), async: true } : { team: S.team.id, async: true };
    try { const j = await api(path, { method: 'POST', body: JSON.stringify(body) }); $('out').textContent = 'started ' + j.run_id + ' - watch the timeline'; }
    catch (e) { $('out').textContent = 'error: ' + e.message; setBusy(false); }
  }
  $('connect').onclick = connect;
  $('team').onchange = (e) => selectTeam(e.target.value);
  $('runTeam').onclick = () => run('team');
  $('runPt').onclick = () => run('playtest');
  if (tok()) connect(); else hint('enter the hive token, then Connect');
})();
</script>
</body>
</html>
