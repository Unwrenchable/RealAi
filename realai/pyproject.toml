[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realai"
version = "2.0.0"
description = "RealAI Hive — unified orchestrator, agents, abilities, GPU stack"
readme = "README.md"
requires-python = ">=3.12,<4.0"

[project.scripts]
realai        = "realai.cli.hive.app:main"
realai-cli    = "realai.cli.hive.app:main"
realai-craft  = "realai.cli.craft:main"
realai-server = "realai.server.app:main"

[tool.setuptools]
packages = ["realai"]
package-dir = {"" = "."}
