# RealAI living plugin — RackUp Coach
# Provider-level AI capability only (no NestJS / no DB code).

name: rackup-coach
version: 1.4.0
author: RealAI / RackUp
description: >
  Professional pool (billiards) coaching and platform intelligence for the
  RackUp app and ROC (Rack of Champions) — practice plans, shot of the day,
  video feedback, moderation, matchmaking, continuous BCA-style rating,
  cross-league convert (APA/BCA/Fargo/TAP/VNEA), league_validate, tournament
  insights, hall/ROC session context, formats (Singles→Scotch→JJ→Teams of 5),
  and full RackUp Pyramid support (7ft/10-ball vs 9ft/15-ball, skill targets,
  classical scoring, call-shot policy, rating weights).
  Pure provider: no ledger/UI ownership. Uses RealAI synthetic organs hive.

kind: living_plugin
provider_level: true
homepage: https://github.com/Unwrenchable/RealAi

permissions:
  - none   # pure inference/coaching logic; host supplies player history

entrypoints:
  register: plugins.rackup_coach:register
  invoke: plugins.rackup_coach:invoke
  organ: organ.rackup-coach

capabilities:
  - professional_coach
  - shot_of_the_day
  - video_analysis
  - chat_moderation
  - matchmaking_support
  - rating_intelligence
  - tournament_insights
  - hall_session_context
  - mental_game
  - practice_plans
  - pattern_recognition
  - pre_match_prep
  - rackup_pyramid
  - pyramid_rules
  - classical_scoring

# Locked RackUp Pyramid rules (see pyramid.py)
pyramid:
  table_to_rack:
    7ft: 10
    9ft: 15
  skill_matrix:
    beginner: { points_7ft: 25, points_9ft: 40, call_shot: no, rating_weight: 0.7 }
    intermediate: { points_7ft: 35, points_9ft: 55, call_shot: no, rating_weight: 0.85 }
    advanced: { points_7ft: 45, points_9ft: 71, call_shot: optional, rating_weight: 1.0 }
    pro: { points_7ft: 50, points_9ft: 71, call_shot: yes, rating_weight: 1.15 }
  scoring:
    type: classical
    ball_1: 11
    cue_ball: designated_only
    win: first_to_target

organs_used:
  - organ.frontal-cortex          # planning practice / match strategy
  - organ.prefrontal-cortex       # multi-step reasoning, inhibition
  - organ.amygdala                # threat/toxicity salience (moderation)
  - organ.cerebellum              # procedural skill refinement / drills
  - organ.hippocampus             # episodic player history
  - organ.short-term-memory
  - organ.long-term-memory
  - organ.episodic-memory
  - organ.semantic-memory
  - organ.procedural-memory
  - organ.synthetic-creativity-furnace
  - organ.synthetic-intuition-layer
  - organ.synthetic-guardian-layer
  - organ.synthetic-consciousness-layer
  - organ.limbic-system           # motivation / mental game

# Coach curriculum bands (content selection) on continuous ROC ladder
rating_bands:
  beginner: [0, 399]
  intermediate: [400, 549]
  advanced: [550, 699]
  pro: [700, 1200]

# ROC display bands (UI chips only — never matchmaking inputs)
roc_display_bands:
  Novice: "<400"
  Intermediate: "400-499"
  Advanced: "500-599"
  Expert: "600-699"
  Elite: "700+"

roc_formats:
  - SINGLES
  - SCOTCH_DOUBLES
  - SCOTCH_JJ
  - TEAMS_5

abilities:
  - id: coach
    module: abilities.coach
    description: Rating-aware professional coaching (basic → advanced → pro)
  - id: shot_of_the_day
    module: abilities.shot_of_the_day
    description: Useful daily shot recs from weaknesses + history
  - id: moderation
    module: abilities.moderation
    description: Harassment, toxicity, money-match drama, sandbagging signals
  - id: video_analysis
    module: abilities.video_analysis
    description: Structured stroke/stance/break feedback + drills
  - id: matchmaking
    module: abilities.matchmaking
    description: Smart matchup suggestions from rating/style
  - id: rating_intel
    module: abilities.rating_intel
    description: Dynamic rating trajectory and skill-gap analysis
  - id: tournament
    module: abilities.tournament
    description: League/tournament bracket and prep insights
  - id: hall_context
    module: abilities.hall_context
    description: Hall/session context awareness
  - id: pyramid_rules
    module: abilities.pyramid_rules
    description: Locked Pyramid matrix + race/context helpers
  - id: pyramid
    module: abilities.coach
    description: Full Pyramid coaching mode (all skill levels × table sizes)

config_defaults:
  organs_enabled: true
  default_discipline: pyramid   # pyramid | eight_ball | nine_ball | ten_ball | straight_pool
  default_table_size: 9ft       # 7ft → 10-ball rack | 9ft → 15-ball rack
  max_history_events: 50
