# RealAI living plugin — effective-engine (learned module)
# Provider-level AI capability only. Generated by git-learn. No heal.

name: effective-engine-main-learned
version: 0.1.0
author: RealAI / git-learn
description: >
  Production-ready luxury real estate platform for [Donna Sells LV](https://www.donnasellslv.com/) — and the foundation for a **proprietary MLS / IDX provider** ecosystem.

kind: living_plugin
provider_level: true
homepage: https://github.com/Unwrenchable/RealAi
stub: true
learned: true

permissions:
  - none

entrypoints:
  register: plugins.effective_engine_main_learned:register
  invoke: plugins.effective_engine_main_learned:invoke

capabilities:
  - health
  - repo_map
  - node_context
  - fastify_context
  - agents_bridge

money:
  authorize_payout: false
  owns_ledger: false
  moves_money: false

abilities:
  - id: health
    module: abilities.health
    description: Stub liveness / contract discovery (no runtime heal)
  - id: repo_map
    module: abilities.repo_map
    description: Summarize learned tree layout and stack
  - id: node_context
    module: abilities.node_context
    description: Placeholder context hints for node (product owns runtime)
  - id: fastify_context
    module: abilities.fastify_context
    description: Placeholder context hints for fastify (product owns runtime)
  - id: agents_bridge
    module: abilities.agents_bridge
    description: Bridge stub for existing .github/agents/ surface

config_defaults:
  stub: true
  learned: true
  organs_enabled: false
  authorize_payout: false
