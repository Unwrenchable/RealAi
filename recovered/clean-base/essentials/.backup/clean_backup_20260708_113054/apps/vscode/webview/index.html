<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d1a;
  --bg2: #13132a;
  --bg3: #1a1a3e;
  --border: #2a2a5a;
  --text: #e0e0ff;
  --text2: #9090cc;
  --accent: #7c5cfc;
  --user-bg: #1a1a5a;
  --ai-bg: #13132a;
  --error: #c62828;
  --code-bg: #0a0a14;
}
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.logo { font-size: 1rem; font-weight: 700; }
.logo .accent { color: var(--accent); }
.header-actions { display: flex; gap: 6px; }
.btn {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.75rem;
  background: var(--bg3);
  color: var(--text);
  transition: background 0.15s;
}
.btn:hover { background: var(--accent); color: #fff; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#messages::-webkit-scrollbar { width: 5px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.message { display: flex; flex-direction: column; max-width: 92%; animation: fadeIn 0.15s ease; }
.message.user { align-self: flex-end; }
.message.assistant, .message.error { align-self: flex-start; }
.message-header {
  font-size: 0.68rem;
  color: var(--text2);
  margin-bottom: 2px;
  padding: 0 4px;
}
.message.user .message-header { text-align: right; }
.bubble {
  padding: 10px 14px;
  border-radius: 10px;
  line-height: 1.55;
  font-size: 0.88rem;
  word-break: break-word;
  white-space: pre-wrap;
}
.message.user .bubble {
  background: var(--user-bg);
  border: 1px solid #2a2a7a;
  border-bottom-right-radius: 3px;
}
.message.assistant .bubble {
  background: var(--ai-bg);
  border: 1px solid var(--border);
  border-bottom-left-radius: 3px;
}
.message.error .bubble {
  background: #2a1010;
  border: 1px solid var(--error);
  color: #ef9a9a;
}
.bubble code {
  background: var(--code-bg);
  padding: 1px 4px;
  border-radius: 3px;
  font-family: 'Cascadia Code', 'Fira Code', monospace;
  font-size: 0.82rem;
}
.bubble pre {
  background: var(--code-bg);
  padding: 10px;
  border-radius: 6px;
  overflow-x: auto;
  margin: 6px 0;
  font-size: 0.82rem;
}
.typing { display: inline-flex; gap: 3px; align-items: center; padding: 4px 0; }
.typing span {
  width: 6px; height: 6px;
  background: var(--text2);
  border-radius: 50%;
  animation: blink 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
#welcome {
  text-align: center;
  margin: auto;
  padding: 30px;
}
#welcome .icon { font-size: 2.5rem; margin-bottom: 10px; }
#welcome h2 { font-size: 1.2rem; margin-bottom: 6px; }
#welcome p { color: var(--text2); font-size: 0.85rem; margin-bottom: 14px; }
.input-area {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 8px 12px;
  flex-shrink: 0;
}
.input-row { display: flex; gap: 8px; align-items: flex-end; }
#input {
  flex: 1;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 0.88rem;
  resize: none;
  min-height: 38px;
  max-height: 140px;
  font-family: inherit;
  line-height: 1.5;
}
#input:focus { outline: none; border-color: var(--accent); }
#send-btn {
  width: 38px; height: 38px;
  border-radius: 8px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}
.hint {
  font-size: 0.7rem;
  color: var(--text2);
  margin-top: 4px;
}
.hint kbd {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0 4px;
  font-size: 0.68rem;
  font-family: inherit;
}
.action-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text2);
  padding: 2px 8px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 0.7rem;
  margin-left: 6px;
  transition: all 0.15s;
}
.action-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
</style>
</head>
<body>
<header>
  <div class="logo">&#x1F916; Real<span class="accent">AI</span> <span style="font-size:0.7rem;color:var(--text2)">Chat</span></div>
  <div class="header-actions">
    <button class="btn" onclick="clearChat()">Clear</button>
  </div>
</header>

<div id="messages">
  <div id="welcome">
    <div class="icon">&#x1F916;</div>
    <h2>RealAI Chat</h2>
    <p>Ask questions about your code, get explanations, or just chat.</p>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="input" rows="1"
      placeholder="Ask RealAI anything..."
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"></textarea>
    <button class="btn" id="send-btn" onclick="sendMessage()">&#x2191;</button>
  </div>
  <div class="hint">
    <kbd>Enter</kbd> to send &middot; <kbd>Shift+Enter</kbd> for new line &middot;
    <kbd>Ctrl+Shift+I</kbd> to insert response
  </div>
</div>

<script>
(function() {
  const vscode = acquireVsCodeApi();
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  let isStreaming = false;
  let streamMsgEl = null;

  vscode.postMessage({ command: 'ready' });

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isStreaming) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    removeWelcome();
    vscode.postMessage({ command: 'stream', text });
  }

  sendBtn.addEventListener('click', sendMessage);

  function clearChat() {
    vscode.postMessage({ command: 'clear' });
  }

  function removeWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  function appendMessage(role, content) {
    const div = document.createElement('div');
    div.className = 'message ' + role;

    const header = document.createElement('div');
    header.className = 'message-header';
    header.textContent = role === 'user' ? 'You' : role === 'assistant' ? 'RealAI' : 'Error';
    div.appendChild(header);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatContent(content);
    div.appendChild(bubble);

    if (role === 'assistant' && content) {
      const insertBtn = document.createElement('button');
      insertBtn.className = 'action-btn';
      insertBtn.textContent = 'Insert';
      insertBtn.title = 'Insert response into editor';
      insertBtn.onclick = function() { vscode.postMessage({ command: 'insertResponse' }); };
      bubble.appendChild(insertBtn);
    }

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function formatContent(text) {
    if (!text) return '';
    var s = text
      .replace(/&/g, '&')
      .replace(/</g, '<')
      .replace(/>/g, '>');

    s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, function(_, lang, code) {
      return '<pre><code>' + code.trim() + '</code></pre>';
    });

    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');

    s = s.replace(/\n\n/g, '</p><p>');
    s = s.replace(/\n/g, '<br>');
    s = '<p>' + s + '</p>';

    return s;
  }

  function streamStart() {
    isStreaming = true;
    sendBtn.disabled = true;

    var div = document.createElement('div');
    div.className = 'message assistant';
    div.id = 'stream-msg';

    var header = document.createElement('div');
    header.className = 'message-header';
    header.textContent = 'RealAI';
    div.appendChild(header);

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    div.appendChild(bubble);

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    streamMsgEl = bubble;
  }

  function streamToken(token) {
    if (!streamMsgEl) return;
    if (streamMsgEl.querySelector('.typing')) {
      streamMsgEl.innerHTML = '';
    }
    streamMsgEl.innerHTML += formatContent(token);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function streamEnd() {
    isStreaming = false;
    sendBtn.disabled = false;
    streamMsgEl = null;
  }

  function setInput(text) {
    inputEl.value = text;
    inputEl.focus();
    autoResize(inputEl);
  }

  window.addEventListener('message', function(e) {
    var d = e.data;
    switch (d.command) {
      case 'append':
        removeWelcome();
        appendMessage(d.role, d.content);
        break;
      case 'streamStart':
        removeWelcome();
        streamStart();
        break;
      case 'streamToken':
        streamToken(d.token);
        break;
      case 'streamEnd':
        streamEnd();
        break;
      case 'clear':
        messagesEl.innerHTML = '';
        messagesEl.innerHTML =
          '<div id="welcome">' +
          '<div class="icon">&#x1F916;</div>' +
          '<h2>RealAI Chat</h2>' +
          '<p>Ask questions about your code, get explanations, or just chat.</p>' +
          '</div>';
        streamEnd();
        break;
      case 'setInput':
        setInput(d.text);
        break;
      case 'activity':
        console.log('[RealAI Activity]', d.text);
        break;
    }
  });
})();
</script>
</body>
</html>
