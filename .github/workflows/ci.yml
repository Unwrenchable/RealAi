name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-ci.txt
          pip install -e ".[test]"
      - name: Run pytest (config in pyproject.toml)
        run: python -m pytest -q

  node-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Auth plugin guard (no magicLink/oAuthProxy)
        run: pnpm run check:auth:plugins
      - name: Root node tests
        run: pnpm run test
      - name: Root typecheck (tsc --noEmit)
        run: pnpm run typecheck
      - name: Root lint (app sources; legacy tools/ and ui/ are out of scope)
        run: pnpm run lint:app
      - name: Root vite build
        run: pnpm exec vite build

  # realai/voice has no lockfile or workspace entry. It is checked against the
  # ROOT install (same better-auth / TanStack / React versions as root; Node
  # resolves realai/voice imports up to ../../node_modules), so no second,
  # unpinned install is introduced.
  voice-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Voice auth tests
        working-directory: realai/voice
        run: node --experimental-strip-types --test src/lib/auth/gate-identity.test.ts src/lib/auth/credentials.test.ts src/lib/auth/plugin-guard.test.ts
      - name: Voice vite build
        working-directory: realai/voice
        run: ../../node_modules/.bin/vite build
      # Non-blocking until the pre-existing errors are fixed: they are in the
      # voice trainer UI (studio.tsx, tts.ts, error-component.tsx,
      # app-data/client.server.ts), which is off-limits without travis's GO.
      - name: Voice typecheck (non-blocking, pre-existing errors)
        continue-on-error: true
        run: node_modules/.bin/tsc -p realai/voice/tsconfig.json --noEmit
      - name: Voice lint (non-blocking, pre-existing errors)
        continue-on-error: true
        working-directory: realai/voice
        run: ../../node_modules/.bin/eslint .
